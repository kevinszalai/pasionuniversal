<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasión Universal · Resultados por mercado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,800;1,400&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002447;
    --blue:#00528F;
    --teal:#008091;
    --cyan:#00C4DF;
    --pink:#FF436E;
    --ink:#3A4654;
    --muted:#6B7A8C;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Poppins',sans-serif;
    background:var(--navy);
    background-image:radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,196,223,.14), transparent 60%);
    color:#fff;
    min-height:100vh;
    padding:48px 32px 40px;
  }
  header{max-width:1360px;margin:0 auto 36px;display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:16px}
  h1{font-weight:800;font-size:clamp(28px,4vw,44px);letter-spacing:.04em;line-height:1.05}
  .logo-img{height:clamp(64px,8vw,96px);display:block;filter:drop-shadow(0 6px 16px rgba(0,0,0,.45))}
  .sub{color:var(--cyan);font-size:15px;margin-top:8px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:0 1 auto;min-width:0}
  .btn{
    font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;
    color:#fff;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);border-radius:999px;
    padding:9px 18px;cursor:pointer;transition:background .2s,border-color .2s;
  }
  .btn:hover{background:rgba(255,255,255,.16)}
  .btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .btn.active{background:var(--cyan);border-color:var(--cyan);color:var(--navy)}

  .grid{
    max-width:1360px;margin:0 auto;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;
  }
  .card{
    background:var(--card);color:var(--ink);
    border-radius:14px;padding:22px 20px 24px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    display:flex;flex-direction:column;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(0,0,0,.45)}
  .country{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:.02em;text-transform:uppercase}
  .country-sub{font-size:11px;color:var(--muted);margin-top:1px;min-height:14px}

  .metric{margin-top:18px}
  .label{
    display:flex;align-items:center;gap:7px;
    font-size:10.5px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);
  }
  .label svg{width:15px;height:15px;flex:none}
  .stat{
    font-family:'Bebas Neue','Poppins',sans-serif;
    font-size:64px;line-height:1;color:var(--teal);
    margin-top:6px;letter-spacing:.01em;
  }
  .money{font-size:19px;font-weight:800;color:var(--blue);margin-top:5px}
  .text{font-size:13px;line-height:1.45;margin-top:6px;color:var(--ink)}
  .metric.extra{margin-top:auto;padding-top:18px}

  [contenteditable="true"]{
    outline:1.5px dashed var(--cyan);outline-offset:3px;border-radius:4px;
    cursor:text;min-width:30px;
  }
  .del{
    margin-left:auto;flex:none;width:18px;height:18px;border-radius:50%;
    border:none;background:rgba(255,67,110,.12);color:var(--pink);
    font-size:12px;line-height:1;cursor:pointer;display:none;
    align-items:center;justify-content:center;font-family:inherit;
  }
  .del:hover{background:var(--pink);color:#fff}
  body.editing .del{display:inline-flex}
  .restore{
    display:none;margin-top:14px;font-family:inherit;font-size:11px;font-weight:600;
    color:var(--teal);background:rgba(0,128,145,.08);border:1px dashed var(--teal);
    border-radius:999px;padding:5px 12px;cursor:pointer;align-self:flex-start;
  }
  .restore:hover{background:rgba(0,128,145,.18)}
  body.editing .restore{display:inline-block}
  [contenteditable="true"]:focus{outline-style:solid;background:rgba(0,196,223,.08)}

  footer{
    max-width:1360px;margin:30px auto 0;
    display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;
    color:var(--cyan);font-size:13px;font-style:italic;
  }
  .hint{color:rgba(255,255,255,.55);font-style:normal;font-size:12px}

  @media (max-width:700px){
    body{padding:32px 18px}
    .stat{font-size:54px}
    .btn{font-size:11px;padding:6px 10px;white-space:nowrap}
    .logo-img{height:56px}
    .sub{font-size:13px}
  }
  @media (prefers-reduced-motion:reduce){
    .card{transition:none}
  }
  @media print{
    body{background:#fff;color:var(--navy);padding:20px}
    .toolbar,.hint{display:none}
    .card{box-shadow:none;border:1px solid #d8dee5}
    .grid{grid-template-columns:repeat(5,1fr);gap:10px}
  }
</style>
</head>
<body>

<header>
  <div>
    <div id="titleZone"></div>

  <div class="toolbar">

</header>

<div class="grid" id="grid"></div>

<footer>
  <span class="hint" id="hint"></span>
</footer>

const FIELDS = [
  { key:"ventas",      cls:"stat"  },
  { key:"ganancia",    cls:"money" },
  { key:"costo",       cls:"money" },
  { key:"aprendizaje", cls:"text"  },
  { key:"extra",       cls:"text", extra:true }
];

let data = load();
let config = loadConfig();
let editing = false;

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return structuredClone(DATA_DEFAULT);
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){}
}
function loadConfig(){
  try{
    const raw = localStorage.getItem(CONFIG_KEY);
    if(raw){
      const c = Object.assign(structuredClone(CONFIG_DEFAULT), JSON.parse(raw));
      c.labels = Object.assign(structuredClone(CONFIG_DEFAULT.labels), c.labels||{});
      return c;
    }
  }catch(e){}
  return structuredClone(CONFIG_DEFAULT);
}
function saveConfig(){
  try{ localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }catch(e){}
}

function renderHeader(){
  const zone = document.getElementById("titleZone");
  if(config.useLogo){
    zone.innerHTML = `<img class="logo-img" src="${LOGO_SRC}" alt="${esc(config.title)}">`;
  }else{
    zone.innerHTML = `<h1 data-h="title">${esc(config.title)}</h1>`;
  }
  document.getElementById("subtitle").textContent = config.subtitle;
  applyEditState();
}

function render(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  data.forEach((m,i)=>{
    const card = document.createElement("article");
    card.className = "card";
    const hidden = m._hidden || [];
    let html = `
      <div class="country" data-i="${i}" data-k="name">${esc(m.name)}</div>
      <div class="country-sub" data-i="${i}" data-k="sub">${esc(m.sub||"")}</div>`;
    FIELDS.forEach(f=>{
      if(hidden.includes(f.key)) return;
      html += `
      <div class="metric${f.extra?" extra":""}">
        <div class="label">${ICONS[f.key]}<span data-l="${f.key}">${esc(config.labels[f.key])}</span>
          <button class="del" data-del="${f.key}" data-i="${i}" title="Quitar este dato de la tarjeta" aria-label="Quitar ${esc(config.labels[f.key])}">×</button>
        </div>
        <div class="${f.cls}" data-i="${i}" data-k="${f.key}">${esc(m[f.key]||"")}</div>
      </div>`;
    });
    hidden.forEach(k=>{
      html += `<button class="restore" data-restore="${k}" data-i="${i}">＋ ${esc(config.labels[k])}</button>`;
    });
    card.innerHTML = html;
    grid.appendChild(card);
  });
  applyEditState();
  if(!editing) animateStats();
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function animateStats(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll(".stat").forEach(el=>{
    const final = el.textContent;
    const match = final.match(/-?\d+(?:[.,]\d+)?/);
    if(!match) return;
    const target = parseFloat(match[0].replace(",","."));
    const dec = (match[0].includes(",")||match[0].includes(".")) ? 1 : 0;
    const t0 = performance.now(), dur = 900;
    function step(t){
      const p = Math.min((t-t0)/dur,1);
      const eased = 1-Math.pow(1-p,3);
      const val = (target*eased).toFixed(dec).replace(".",",");
      el.textContent = final.replace(match[0], val);
      if(p<1) requestAnimationFrame(step); else el.textContent = final;
    }
    requestAnimationFrame(step);
  });
}

function applyEditState(){
  document.body.classList.toggle("editing", editing);
  document.querySelectorAll("[data-k],[data-h],[data-l]").forEach(el=>{
    el.contentEditable = editing ? "true" : "false";
  });
  document.getElementById("editBtn").classList.toggle("active", editing);
  document.getElementById("editBtn").textContent = editing ? "✓ Guardar" : "✎ Editar datos";
  document.getElementById("hint").textContent = editing
    ? "Clic en cualquier dato o etiqueta para editarlo · × quita un dato de la tarjeta · ＋ lo vuelve a agregar. Se guarda en este navegador."
    : "";
}

document.querySelector("header").addEventListener("input", e=>{
  const el = e.target.closest("[data-h]");
  if(!el || !editing) return;
  config[el.dataset.h] = el.textContent;
  saveConfig();
});

document.getElementById("grid").addEventListener("input", e=>{
  const v = e.target.closest("[data-k]");
  if(v && editing){
    data[+v.dataset.i][v.dataset.k] = v.textContent;
    save();
    return;
  }
  const l = e.target.closest("[data-l]");
  if(l && editing){
    config.labels[l.dataset.l] = l.textContent;
    saveConfig();
    // sincronizar la misma etiqueta en las demás tarjetas
    document.querySelectorAll(`[data-l="${l.dataset.l}"]`).forEach(o=>{
      if(o!==l) o.textContent = l.textContent;
    });
  }
});

document.getElementById("grid").addEventListener("click", e=>{
  if(!editing) return;
  const del = e.target.closest("[data-del]");
  if(del){
    const m = data[+del.dataset.i];
    m._hidden = m._hidden || [];
    if(!m._hidden.includes(del.dataset.del)) m._hidden.push(del.dataset.del);
    save(); render();
    return;
  }
  const res = e.target.closest("[data-restore]");
  if(res){
    const m = data[+res.dataset.i];
    m._hidden = (m._hidden||[]).filter(k=>k!==res.dataset.restore);
    save(); render();
  }
});

document.getElementById("editBtn").addEventListener("click", ()=>{
  editing = !editing;
  if(!editing){ save(); render(); } else { applyEditState(); }
});

document.getElementById("printBtn").addEventListener("click", ()=>window.print());

renderHeader();
render();
</script>
</body>
</html>
